name: Build & Release

defaults:
  run:
    shell: bash

on:
  push:
    branches: ['**']
    tags: ['v*', '*-deko3d']
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Install 7z
        run: apt-get update -qq && apt-get install -y p7zip-full

      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0
      - name: libryazhahand-deko (private, deploy key)
        env:
          DEKO_KEY: ${{ secrets.LIBRYAZHAHAND_DEKO_KEY }}
        run: |
          command -v ssh >/dev/null 2>&1 || { if command -v apt-get >/dev/null 2>&1 && [ "$(id -u)" = 0 ]; then apt-get update -qq && apt-get install -y -qq openssh-client; else sudo apt-get install -y -qq openssh-client; fi; }
          mkdir -p ~/.ssh && printf '%s\n' "$DEKO_KEY" > ~/.ssh/libryazhahand-deko && chmod 600 ~/.ssh/libryazhahand-deko
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global --add safe.directory '*'
          git config --global url."git@github.com:Dimasick-git/libryazhahand-deko".insteadOf "https://github.com/Dimasick-git/libryazhahand-deko"
          git config --global core.sshCommand "ssh -i $HOME/.ssh/libryazhahand-deko -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
          git submodule update --init --recursive

      - name: Fix git safe.directory
        run: git config --global --add safe.directory '*'

      - name: Build libnx 4.12.0
        run: |
          git clone --depth 1 --branch v4.12.0 https://github.com/switchbrew/libnx.git "$RUNNER_TEMP/libnx"
          test "$(git -C "$RUNNER_TEMP/libnx" rev-parse HEAD)" = "7644c9b26099aa2d2145bc72a21ee24190e92085"
          make -C "$RUNNER_TEMP/libnx" -j"$(nproc)"
          make -C "$RUNNER_TEMP/libnx" install
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" --version

      - name: Build common library
        run: make -C common -j$(nproc)

      - name: Build distribution package
        run: make dist -j$(nproc)

      - name: Verify package
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('out/Fizeau.zip') as archive:
              assert archive.testzip() is None
              overlay = archive.read('switch/.overlays/Fizeau.ovl')
              assert overlay[16:20] == b'NRO0'
              assert overlay[-4:] == b'RYZH'
              assert archive.read('atmosphere/contents/0100000000000F12/exefs.nsp')[:4] == b'PFS0'
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: Fizeau
          path: out/Fizeau.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: Fizeau

      - name: Resolve tag
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Fizeau ${{ steps.tag.outputs.tag }}
          generate_release_notes: false
          body_path: docs/RELEASE_NOTES_DEKO3D.md
          files: Fizeau.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
